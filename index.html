<!DOCTYPE html>
<html>
<head>
  <title>My Todo List</title>
  <style>
    body {
      background-color: lightblue;
      font-family: Arial;
      text-align: center;
    }
 
    h1 {
      color: darkblue;
      font-size: 40px;
    }
 
    input {
      font-size: 20px;
      padding: 8px;
      width: 300px;
    }
 
    button {
      font-size: 20px;
      padding: 8px 15px;
      background-color: green;
      color: white;
      border: none;
      cursor: pointer;
    }
 
    button:hover {
      background-color: darkgreen;
    }
 
    ul {
      list-style: none;
      padding: 0;
      width: 400px;
      margin: 20px auto;
    }
 
    li {
      background-color: white;
      font-size: 22px;
      padding: 10px;
      margin: 8px 0;
      border: 2px solid darkblue;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
 
    li.done {
      text-decoration: line-through;
      background-color: lightgray;
      color: gray;
    }
 
    .delete-btn {
      background-color: red;
      font-size: 16px;
      padding: 5px 10px;
    }
 
    .delete-btn:hover {
      background-color: darkred;
    }
 
    p {
      font-size: 18px;
      color: darkblue;
    }
  </style>
</head>
<body>
 
  <h1>My Todo List</h1>
 
  <input type="text" id="taskInput" placeholder="Write a task...">
  <button onclick="addTask()">Add Task</button>
 
  <p id="counter">You have 0 tasks</p>
 
  <ul id="taskList"></ul>
 
  <script>
    var tasks = []
 
    function addTask() {
      var input = document.getElementById("taskInput")
      var text = input.value
 
      if (text == "") {
        alert("Please write something!")
        return
      }
 
      tasks.push({ text: text, done: false })
      input.value = ""
      showTasks()
    }
 
    function toggleDone(i) {
      tasks[i].done = !tasks[i].done
      showTasks()
    }
 
    function deleteTask(i) {
      tasks.splice(i, 1)
      showTasks()
    }
 
    function showTasks() {
      var list = document.getElementById("taskList")
      var counter = document.getElementById("counter")
      list.innerHTML = ""
 
      for (var i = 0; i < tasks.length; i++) {
        var li = document.createElement("li")
 
        if (tasks[i].done) {
          li.className = "done"
        }
 
        var span = document.createElement("span")
        span.textContent = tasks[i].text
        span.onclick = (function(index) {
          return function() { toggleDone(index) }
        })(i)
        span.style.cursor = "pointer"
 
        var btn = document.createElement("button")
        btn.textContent = "Delete"
        btn.className = "delete-btn"
        btn.onclick = (function(index) {
          return function() { deleteTask(index) }
        })(i)
 
        li.appendChild(span)
        li.appendChild(btn)
        list.appendChild(li)
      }
 
      counter.textContent = "You have " + tasks.length + " tasks"
    }
 
    document.getElementById("taskInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        addTask()
      }
    })
  </script>
 
</body>
</html>
